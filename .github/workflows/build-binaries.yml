name: Build release binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: build release binaries (arch)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring git curl rust clang pkgconf \
            cairo glib2 libdisplay-info libglvnd libinput libpipewire libxkbcommon \
            mesa pango pixman seatd systemd-libs vulkan-icd-loader wayland

      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release -p clarion -p clarion-settings -p clarion-shell

      - name: Stage artifacts
        run: |
          mkdir -p stage/bin stage/share/wayland-sessions stage/share/xdg-desktop-portal stage/lib/systemd/user
          install -m755 target/release/clarion target/release/clarion-settings target/release/clarion-shell resources/clarion-session stage/bin/
          install -m644 resources/clarion.desktop stage/share/wayland-sessions/
          install -m644 resources/clarion-portals.conf stage/share/xdg-desktop-portal/
          install -m644 resources/clarion.service resources/clarion-shell.service resources/clarion-shutdown.target stage/lib/systemd/user/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarion-arch-x86_64
          path: stage/
